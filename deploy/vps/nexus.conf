# Nexus — app Blazor Server em container (127.0.0.1:5100). Atrás do Cloudflare, com o mesmo
# certificado de origem do aamora (*.aamora.com.br).
map $http_upgrade $nexus_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name nexus.aamora.com.br;
    return 301 https://nexus.aamora.com.br$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name nexus.aamora.com.br;
    include snippets/aamora-ssl.conf;

    # Anexos de até 10 MB (limite do SignalR no app é 11 MB).
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:5100;
        proxy_http_version 1.1;
        # WebSocket do circuito Blazor / SignalR.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $nexus_connection_upgrade;
        proxy_set_header Host $host;
        # $remote_addr já é o IP real (CF-Connecting-IP, ver 01-cloudflare-realip.conf).
        # Substitui em vez de acrescentar: o app aceita um único salto (ForwardLimit = 1).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
