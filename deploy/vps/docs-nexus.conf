# Documentação do Nexus (docs-nexus.aamora.com.br): site estático gerado pelo MkDocs, publicado
# pelo workflow docs-site.yml em /var/www/docs-nexus/current (symlink trocado pelo nexus-deploy).
# Atrás do Cloudflare, com o mesmo certificado de origem do aamora (*.aamora.com.br).
server {
    listen 80;
    listen [::]:80;
    server_name docs-nexus.aamora.com.br;
    # O Let's Encrypt valida o nome por aqui (HTTP-01) antes de o certificado cobrir o docs-nexus.
    include snippets/acme-challenge.conf;
    location / { return 301 https://docs-nexus.aamora.com.br$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name docs-nexus.aamora.com.br;
    include snippets/aamora-ssl.conf;

    root /var/www/docs-nexus/current;
    index index.html;

    # O MkDocs gera uma pasta por página (guia/tarefas/index.html); o 404 é a página do próprio site.
    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;

    # Conteúdo versionado pelo nome do arquivo (assets/...); as páginas HTML ficam curtas no cache
    # para uma publicação aparecer logo.
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }
    location ~* \.html$ {
        expires 5m;
    }

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}
