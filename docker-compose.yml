services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: Nexus
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d Nexus"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      APPLY_MIGRATIONS_ON_STARTUP: "true"
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=Nexus;Username=postgres;Password=${POSTGRES_PASSWORD}"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
