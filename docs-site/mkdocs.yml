# Site público de documentação do Nexus (docs-nexus.aamora.com.br), issue #73.
# Fonte em docs-site/docs; build no workflow .github/workflows/docs-site.yml; servido pelo Nginx
# da VPS como arquivos estáticos (deploy/vps/docs-nexus.conf). Rodar local:
#   python -m venv .venv && .venv/bin/pip install -r docs-site/requirements.txt
#   .venv/bin/mkdocs serve -f docs-site/mkdocs.yml
site_name: Nexus · Documentação
site_url: https://docs-nexus.aamora.com.br/
site_description: Guia do usuário, integrações, self-hosted e referência da API do Nexus.
copyright: Aamora · Nexus
docs_dir: docs
site_dir: site

theme:
  name: material
  language: pt-BR
  # Identidade do Nexus (DESIGN.md): índigo, Inter hospedada aqui mesmo (font: false desliga o Google
  # Fonts), logo do app. As cores ficam em assets/stylesheets/nexus.css, por isso "custom".
  font: false
  logo: assets/images/logo.png
  favicon: assets/images/logo.png
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Tema escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Tema claro

extra_css:
  - assets/stylesheets/nexus.css

# Montador de instalação (Self-hosted → Instalação, #90): gera compose e comandos no navegador.
extra_javascript:
  - assets/javascripts/instalador.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  # Ícones (:material-api:) nas páginas; sem esta extensão o texto aparece cru.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search:
      lang: pt

nav:
  - Início: index.md
  - Guia do usuário:
      - Visão geral: guia/index.md
      - Workspaces, spaces e listas: guia/workspaces.md
      - Tarefas, quadro e backlog: guia/tarefas.md
      - Sprints, Gantt e calendário: guia/planejamento.md
      - Docs e planilhas: guia/docs-e-planilhas.md
      - Chat e notificações: guia/chat.md
      - Conta e segurança: guia/conta.md
      - Calendário (feed iCal): guia/calendario.md
      - Horas e contratos: guia/horas-e-contratos.md
      - Check-in semanal: guia/check-in.md
      - Planos: guia/planos.md
  - Integrações:
      - Visão geral: integracoes/index.md
      - API de integração: integracoes/api.md
      - Referência da API: integracoes/api-referencia.md
      - Receitas: integracoes/api-receitas.md
      - Webhooks de saída: integracoes/webhooks.md
      - Assistentes de IA (MCP): integracoes/mcp.md
      - Stripe (cobrança): integracoes/stripe.md
      - E-mail, Redis e monitoramento: integracoes/infraestrutura.md
      - GitHub e GitLab: integracoes/github-gitlab.md
  - Self-hosted:
      - Visão geral: self-hosted/index.md
      - Instalação: self-hosted/instalacao.md
      - Configuração: self-hosted/configuracao.md
      - E-mail (SMTP): self-hosted/email.md
      - Backup e restauração: self-hosted/backup.md
      - Atualização: self-hosted/atualizacao.md
      - Licença: self-hosted/licenca.md
      - Active Directory: self-hosted/active-directory.md
      - Integrações na sua instalação: self-hosted/integracoes.md
  - API (OpenAPI): api/index.md
