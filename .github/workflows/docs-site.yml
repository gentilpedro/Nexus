# Site de documentação (docs-nexus.aamora.com.br), issue #73.
#
# Em PR: só constrói, com --strict (link quebrado falha o build). Na main: constrói e publica na
# VPS pelo mesmo canal do deploy do app (chave do usuário `deploy`, comando `nexus-deploy`), que
# recebe o site como tar.gz e troca o symlink que o Nginx serve. Nada de container: é HTML
# estático, e o Nginx do host já está lá.
name: Site de documentação

on:
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - ".github/workflows/docs-site.yml"
  pull_request:
    paths:
      - "docs-site/**"
      - ".github/workflows/docs-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs-site/requirements.txt

      - name: Dependências
        run: pip install -r docs-site/requirements.txt

      - name: Construir o site
        run: mkdocs build --strict -f docs-site/mkdocs.yml

      - name: Empacotar
        run: tar -C docs-site/site -czf docs-site.tar.gz .

      - name: Guardar o pacote
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: docs-site.tar.gz
          retention-days: 7

  publish:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: vps
      url: https://docs-nexus.aamora.com.br
    steps:
      - name: Baixar o pacote
        uses: actions/download-artifact@v4
        with:
          name: docs-site

      # Mesma chave e mesmo host do deploy do app; o comando é outro subcomando do nexus-deploy.
      - name: Configurar o SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Publicar
        run: ssh -o BatchMode=yes "deploy@${{ secrets.VPS_HOST }}" docs-site "${GITHUB_SHA::12}" < docs-site.tar.gz

      - name: Conferir o site no ar
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS -m 10 -o /dev/null https://docs-nexus.aamora.com.br/; then echo "ok"; exit 0; fi
            sleep 10
          done
          echo "::error::https://docs-nexus.aamora.com.br/ não respondeu depois da publicação."
          exit 1
