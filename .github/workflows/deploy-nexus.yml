name: Deploy Nexus

on:
  push:
    branches:
      - main
  # O quality gate abaixo só valia depois do merge: a workflow rodava exclusivamente em push na
  # main, então um PR quebrado entrava e só ficava vermelho depois — foi exatamente o que
  # aconteceu no PR #17. Com o gatilho de pull_request, verify roda antes do merge; o job de
  # deploy é que fica restrito a push (veja o `if` nele).
  pull_request:
    branches:
      - main
  # Lets a failed or reverted release be re-run without pushing an empty commit.
  workflow_dispatch:

# Token restrito por padrão. Só o job de release amplia para contents: write, que é o mínimo para
# criar a tag e a release.
permissions:
  contents: read

# Um push novo no mesmo PR torna a execução anterior irrelevante — cancelar economiza minutos de
# runner. Nunca cancela execuções da main: interromper um deploy pela metade deixaria o
# app_offline.htm no servidor e o site fora do ar.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decide o número da próxima versão a partir dos commits desde a última tag (Conventional
  # Commits — veja .github/scripts/next-version.sh). Roda antes de tudo porque a versão precisa
  # ser carimbada no binário que o verify compila, não aplicada depois.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      previous_tag: ${{ steps.compute.outputs.previous_tag }}
      bump: ${{ steps.compute.outputs.bump }}
      has_changes: ${{ steps.compute.outputs.has_changes }}
      build_timestamp: ${{ steps.compute.outputs.build_timestamp }}

    steps:
      # fetch-depth: 0 traz histórico e tags completos — sem isso não há como saber qual foi a
      # última release nem quais commits vieram depois dela.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A lógica de versionamento decide o número que vai para a tag e para produção. Se ela
      # errar em silêncio o estrago só aparece depois de publicado, então é testada aqui, antes
      # de ser usada.
      - name: Testar os scripts de release
        run: bash .github/scripts/test-release-scripts.sh

      - name: Calcular a próxima versão
        id: compute
        run: |
          bash .github/scripts/next-version.sh | tee -a "$GITHUB_OUTPUT"
          echo "build_timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$GITHUB_OUTPUT"

      # Deixa o resultado visível na página da execução — num PR, mostra qual versão aquele merge
      # produziria.
      - name: Resumo da versão
        run: |
          {
            echo "### Versão desta build"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Versão | \`${{ steps.compute.outputs.version }}\` |"
            echo "| Release anterior | \`${{ steps.compute.outputs.previous_tag || 'nenhuma' }}\` |"
            echo "| Tipo de incremento | \`${{ steps.compute.outputs.bump }}\` |"
            echo "| Commit | \`${GITHUB_SHA:0:7}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Quality gate. Everything that can reject a bad change runs here, before any job that can
  # touch production exists. Previously build/publish/deploy were a single job with no test or
  # vulnerability step at all, so any commit pushed to main shipped straight to users.
  verify:
    needs: version
    runs-on: ubuntu-latest

    # Carimba a identificação da build no assembly: o SDK junta Version e SourceRevisionId em
    # AssemblyInformationalVersion ("1.4.0+<sha>") e BuildTimestamp vira um AssemblyMetadata.
    # É isso que /version e o rodapé do app leem em tempo de execução.
    #
    # Passado em toda invocação do MSBuild abaixo, não só no publish: a análise estática
    # recompila com --no-incremental e sobrescreveria os assemblies carimbados.
    env:
      VERSION_PROPS: >-
        -p:Version=${{ needs.version.outputs.version }}
        -p:SourceRevisionId=${{ github.sha }}
        -p:BuildTimestamp=${{ needs.version.outputs.build_timestamp }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The whole solution, not just Nexus.Web — the test projects are part of it, and a
      # compilation break in one of them must fail the gate too.
      - name: Restore
        run: dotnet restore Nexus.slnx

      - name: Build
        run: |
          # shellcheck disable=SC2086  # VERSION_PROPS são vários argumentos: o split é proposital.
          dotnet build Nexus.slnx --configuration Release --no-restore $VERSION_PROPS

      - name: Test
        run: dotnet test Nexus.slnx --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory ./test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./test-results

      # Fails the build on any *known-vulnerable* package. `dotnet list package --vulnerable`
      # always exits 0, so the severity has to be detected in its output.
      #
      # AngleSharp 0.17.1 (moderate, GHSA-pgww-w46g-26qg) is a known and documented exception —
      # see the comment on its PackageReference in Nexus.Web.csproj. Only High/Critical block the
      # deploy; anything moderate is reported and left visible in the log.
      - name: Check for vulnerable dependencies
        run: |
          dotnet list Nexus.slnx package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          if grep -qiE '\|\s*(High|Critical)\s*\|' vuln.txt; then
            echo "::error::High or Critical severity vulnerability found in dependencies."
            exit 1
          fi
          echo "No High/Critical vulnerabilities found."

      # Static analysis: fail on any compiler warning treated across the solution, and verify
      # formatting has not drifted. Kept as a separate non-fatal report for whitespace so a
      # formatting nit never blocks a security fix, while real analyzer findings do.
      - name: Static analysis (analyzers as errors)
        run: |
          # shellcheck disable=SC2086  # VERSION_PROPS são vários argumentos: o split é proposital.
          dotnet build Nexus.slnx --configuration Release --no-incremental $VERSION_PROPS /p:TreatWarningsAsErrors=true /p:WarningsNotAsErrors=NU1902

      - name: Publish
        run: |
          # shellcheck disable=SC2086  # VERSION_PROPS são vários argumentos: o split é proposital.
          dotnet publish src/Nexus.Web/Nexus.Web.csproj -c Release -o publish --no-restore $VERSION_PROPS

      # Falha cedo e com mensagem clara se o carimbo não chegou ao binário. Sem esta conferência
      # um erro nas propriedades do MSBuild passaria despercebido e o app publicado se
      # identificaria como "0.0.0-local" em produção.
      - name: Conferir a versão carimbada
        run: |
          expected="${{ needs.version.outputs.version }}"
          # -a trata o .dll como texto: o valor do atributo fica em UTF-8 nos metadados do
          # assembly. Evita depender de `strings` (binutils) estar instalado no runner.
          found="$(grep -aoE "${expected}\+[0-9a-f]{40}" publish/Nexus.Web.dll | head -n 1 || true)"
          if [ -z "$found" ]; then
            echo "::error::O binário publicado não foi carimbado com a versão ${expected}."
            exit 1
          fi
          echo "Versão carimbada: ${found}"

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: publish
          path: ./publish

  deploy:
    needs: [version, verify]
    # O gate acima roda em PR também; este job, não. Sem esta condição, abrir um PR publicaria em
    # produção — e os secrets de FTP/banco ficariam expostos a qualquer execução de PR.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Bind to a GitHub Environment so branch restrictions and (optionally) a required reviewer
    # can be enforced on the production deploy itself, in the repo settings, without editing this
    # file. Also scopes the FTP/DB secrets to this job only.
    environment:
      name: production
      url: https://usenexus.runasp.net

    steps:
      - name: Download publish artifact
        uses: actions/download-artifact@v4
        with:
          name: publish
          path: ./publish

      # Nexus applies EF Core migrations on startup (see APPLY_MIGRATIONS_ON_STARTUP in
      # Program.cs) — no separate "dotnet ef database update" step here, so there's only
      # one place responsible for keeping the schema in sync.
      #
      # NOTE: migrations run unattended against production on the next app start. Take a database
      # backup before merging a release that contains a destructive migration — see
      # docs/backup-restore.md.
      - name: Inject production connection string
        run: |
          jq --arg cs "${{ secrets.PROD_SQL_CONNECTION_STRING }}" \
             '.ConnectionStrings.DefaultConnection = $cs' \
             publish/appsettings.Production.json > publish/appsettings.Production.json.tmp
          mv publish/appsettings.Production.json.tmp publish/appsettings.Production.json

      # BREVO_API_KEY is the HTTP API key ("xkeysib-..."), not the old SMTP key. The mailer moved
      # off SMTP because this host blocks outbound SMTP on the free plan — see BrevoMailer.cs.
      - name: Inject Brevo credentials
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
        run: |
          # Shipping without these produces an app that cannot send e-mail and says nothing about
          # it — which is precisely how the SMTP outage stayed invisible for weeks. Registration
          # depends on the confirmation e-mail, so this is a broken deploy, not a degraded one.
          if [ -z "$BREVO_API_KEY" ] || [ -z "$BREVO_SENDER_EMAIL" ]; then
            echo "::error::BREVO_API_KEY or BREVO_SENDER_EMAIL is not set. Account confirmation and workspace invites cannot work without them."
            exit 1
          fi
          jq --arg key "$BREVO_API_KEY" --arg sender "$BREVO_SENDER_EMAIL" \
             '.Brevo.ApiKey = $key | .Brevo.SenderEmail = $sender' \
             publish/appsettings.Production.json > publish/appsettings.Production.json.tmp
          mv publish/appsettings.Production.json.tmp publish/appsettings.Production.json

      # The FTP server presents a perfectly valid Let's Encrypt certificate for *.siteasp.net, but
      # sends ONLY the leaf — no intermediates. Browsers and Windows/schannel hide this by
      # fetching the missing issuer from the certificate's AIA extension; OpenSSL does not, so
      # every curl on a Linux runner failed with "unable to get local issuer certificate" (exit
      # 60) and no deploy has reached production since 07/08/2026.
      #
      # The fix is to do the AIA walk ourselves and hand the completed chain to curl. This is NOT
      # the same as --insecure: each fetched certificate must still chain up to a root already in
      # the runner's trust store, and the final `openssl verify` fails the job if it does not.
      # Following AIA rather than pinning a certificate means Let's Encrypt renewals and
      # intermediate rotations do not silently break the deploy again.
      #
      # Today the walk takes two hops: leaf -> YR2 -> ISRG Root YR (cross-signed by ISRG Root X1,
      # which every trust store has).
      - name: Complete the FTP server's certificate chain
        run: |
          set -euo pipefail
          HOST="${{ secrets.FTP_SERVER }}"
          D=$(mktemp -d)
          openssl s_client -connect "$HOST:21" -starttls ftp </dev/null 2>/dev/null | openssl x509 -out "$D/0.pem"
          CUR="$D/0.pem"; : > "$D/extra.pem"
          for i in 1 2 3 4; do
            URI=$(openssl x509 -in "$CUR" -noout -text | grep -oP 'CA Issuers - URI:\K\S+' | head -1 || true)
            [ -n "$URI" ] || break
            echo "AIA hop $i: $URI"
            curl -fsSL -o "$D/$i.bin" "$URI"
            openssl x509 -inform DER -in "$D/$i.bin" -out "$D/$i.pem" 2>/dev/null || openssl x509 -in "$D/$i.bin" -out "$D/$i.pem"
            openssl x509 -in "$D/$i.pem" -noout -subject
            cat "$D/$i.pem" >> "$D/extra.pem"
            CUR="$D/$i.pem"
            openssl verify -untrusted "$D/extra.pem" "$CUR" >/dev/null 2>&1 && break
          done
          # Fails the job if the completed chain still does not verify against the system roots.
          openssl verify -untrusted "$D/extra.pem" "$D/0.pem"
          cp "$D/extra.pem" "$GITHUB_WORKSPACE/ftps-ca.pem"
          cat /etc/ssl/certs/ca-certificates.crt "$GITHUB_WORKSPACE/ftps-ca.pem" > "$GITHUB_WORKSPACE/ftps-ca-bundle.pem"
          echo "FTPS_CA=$GITHUB_WORKSPACE/ftps-ca.pem" >> "$GITHUB_ENV"
          echo "FTPS_CA_BUNDLE=$GITHUB_WORKSPACE/ftps-ca-bundle.pem" >> "$GITHUB_ENV"

      # --ssl-reqd aborts rather than silently downgrading if the server will not negotiate TLS.
      # Plain FTP sent the credentials AND appsettings.Production.json — which by this point
      # contains the live database connection string and the Brevo SMTP key — in cleartext over
      # the public internet.
      - name: Take app offline (release IIS file locks)
        run: |
          echo "App temporarily offline for deployment." > app_offline.htm
          curl --ssl-reqd --ftp-pasv --cacert "$FTPS_CA_BUNDLE" -T app_offline.htm --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" "ftp://${{ secrets.FTP_SERVER }}/wwwroot/app_offline.htm"

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        # Same missing-intermediate problem, different TLS stack: this action is Node, and
        # NODE_EXTRA_CA_CERTS appends to (never replaces) Node's built-in roots.
        env:
          NODE_EXTRA_CA_CERTS: ${{ env.FTPS_CA }}
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Explicit FTPS (AUTH TLS on the standard port). Without this the action defaults to
          # plain "ftp" and the entire deployment travels unencrypted.
          protocol: ftps
          local-dir: ./publish/
          server-dir: /wwwroot/
          # Uploaded task/chat attachments live on the server under App_Data/uploads —
          # never part of the publish output, but excluded explicitly so a future
          # clean-slate sync can never wipe real user data.
          exclude: |
            **/App_Data/uploads/**

      - name: Bring app back online
        # Runs even if the deploy step failed: leaving app_offline.htm behind would keep the site
        # down indefinitely on a partial failure.
        if: always()
        run: |
          # Falls back to the bare system store if the chain step never ran — that call will fail,
          # but with the real error rather than an empty --cacert argument.
          curl --ssl-reqd --ftp-pasv --cacert "${FTPS_CA_BUNDLE:-/etc/ssl/certs/ca-certificates.crt}" --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" -Q "DELE /wwwroot/app_offline.htm" "ftp://${{ secrets.FTP_SERVER }}/"

  # Cria a tag e a GitHub Release com as notas do que mudou.
  #
  # Depois do deploy, de propósito: a tag passa a significar "esta versão está no ar", não "esta
  # versão compilou". Se o deploy falhar, nenhuma tag é criada e o mesmo número é recalculado na
  # próxima tentativa.
  release:
    needs: [version, deploy]
    if: github.event_name == 'push' && needs.version.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      # Necessário para criar a tag e publicar a release.
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gerar as notas da release
        env:
          PREVIOUS_TAG: ${{ needs.version.outputs.previous_tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          bash .github/scripts/release-notes.sh "$PREVIOUS_TAG" "$VERSION" "$GITHUB_REPOSITORY" \
            > release-notes.md
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

      # gh release create cria a tag em --target junto com a release, então não há push de tag
      # separado que pudesse divergir do que foi publicado.
      - name: Publicar a release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes-file release-notes.md \
            --target "$GITHUB_SHA"
